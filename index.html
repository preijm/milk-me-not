<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The site has one, light palette. Without this, a phone in dark mode
         (Chrome's auto-dark, Samsung Internet) inverts its colours on its own
         and the greens, cream and photos come out muddy. "only" is the part
         that opts out of that forced darkening. -->
    <meta name="color-scheme" content="only light" />
    <title>Milk Me Not — Plant-based milk ratings & reviews</title>
    <meta name="description" content="Discover and rate plant-based milks. Read real reviews from a community obsessed with taste — find the perfect oat, almond, soy or coconut milk for coffee, cereal and cooking." />
    <meta name="author" content="Milk Me Not" />
    <link rel="icon" href="/lovable-uploads/9f030b65-074a-4e64-82d9-f0eba7246e1a.png" type="image/png" />

    <!-- Installable from a phone's browser: manifest, icons, and the colours the
         browser bar and the installed app's splash use. iOS ignores most of the
         manifest and reads the apple-* tags instead. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#00bf63" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Milk Me Not" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Open Graph / social -->
    <meta property="og:title" content="Milk Me Not — Plant-based milk ratings & reviews" />
    <meta property="og:description" content="Discover and rate plant-based milks. Real reviews from a community obsessed with taste." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://milkmenot.com/" />
    <meta property="og:image" content="https://milkmenot.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Milk Me Not — Plant-based milk ratings & reviews" />
    <meta name="twitter:description" content="Discover and rate plant-based milks. Real reviews from a community obsessed with taste." />
    <meta name="twitter:image" content="https://milkmenot.com/og-image.png" />

    <!-- Sitewide structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Milk Me Not",
        "url": "https://milkmenot.com",
        "logo": "https://milkmenot.com/lovable-uploads/9f030b65-074a-4e64-82d9-f0eba7246e1a.png"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Milk Me Not",
        "url": "https://milkmenot.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://milkmenot.com/results?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Minimal FOUC prevention - fade in instead of blocking LCP -->
    <style>
      html:not(.ready) body { opacity: 0; }
      html.ready body { opacity: 1; transition: opacity 0.1s ease-in; }
    </style>

    <!-- Design system fonts: Epilogue (display/headlines) + Manrope (body/UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Preconnect to Supabase to reduce critical request chain -->
    <link rel="preconnect" href="https://jtabjndnietpewvknjrm.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://jtabjndnietpewvknjrm.supabase.co">

    <!-- Referrer policy is honoured as a meta tag. The rest are real headers,
         served from public/_headers -- X-Content-Type-Options and friends are
         ignored by browsers in meta form. -->
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- Counterscale: cookieless analytics, same Worker as peterandco.nl, separate site-id.
         Gated on the live hostname so `bun dev`, preview deploys and the workers.dev URL
         never write into the production dataset, and on an opt-out remembered per browser
         so my own visits to check a change don't inflate the numbers. `?notrack=1` to stop
         counting this browser, `?notrack=0` to start again. -->
    <script>
      (function () {
        var KEY = 'pco-notrack', excluded = false, note = '';

        // The switch lives in the tracking dashboard, which links here with the
        // parameter set. The flag still has to be written on this origin --
        // localStorage is origin-scoped, so nothing running on localhost can set
        // it for milkmenot.com.
        try {
          var v = new URLSearchParams(location.search).get('notrack');
          if (v === '1') { localStorage.setItem(KEY, '1'); note = 'This browser is no longer counted.'; }
          if (v === '0') { localStorage.removeItem(KEY); note = 'This browser is counted again.'; }
          excluded = !!localStorage.getItem(KEY);
        } catch (e) {} // private mode: count the visit rather than lose it

        // Confirmation for an explicit ?notrack=1/0 arrival only, so the action is
        // something I can trust rather than take on faith. A visitor never carries
        // the parameter and so never sees this. Appended to body as a sibling of
        // #root, so React never sees it either. Never blocks a click.
        if (note) {
          var toast = function () {
            var el = document.createElement('div');
            el.setAttribute('role', 'status');
            el.textContent = note;
            el.style.cssText = 'position:fixed;left:16px;bottom:16px;z-index:2147483647;' +
              'font:500 13px/1 ui-sans-serif,system-ui,sans-serif;padding:11px 16px;' +
              'border-radius:999px;background:#0a0a0a;color:#fff;' +
              'border:1px solid rgba(255,255,255,.25);pointer-events:none;' +
              'opacity:1;transition:opacity .6s';
            document.body.appendChild(el);
            setTimeout(function () { el.style.opacity = '0'; }, 3600);
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 4400);
          };
          if (document.body) toast();
          else document.addEventListener('DOMContentLoaded', toast);
        }

        if (excluded) return;
        if (!/(^|\.)milkmenot\.com$/.test(location.hostname) || navigator.webdriver) return;

        // Counterscale records a pageview synchronously inside its own pushState
        // patch, and it reads <link rel="canonical"> in preference to location.
        // React has not re-rendered by then, so react-helmet-async still has the
        // *previous* page's canonical in the DOM and every client-side navigation
        // was filed one page behind -- clicking /about recorded /. Patching history
        // here, before the tracker is appended, puts these wrappers inside the
        // tracker's own, so the canonical is already correct when it looks.
        //
        // The tracker patches pushState and popstate but not replaceState, so
        // replace-mode navigations were never counted: the logged-in
        // `<Navigate to="/feed" replace />` on the home page, the ProtectedRoute
        // redirects, and the deep links. Those are reported here -- but only when
        // the pathname actually changes. The Results filters rewrite the query
        // string through replaceState on every keystroke, and counting those would
        // bury the real numbers under /results.
        (function () {
          var nativePush = history.pushState;
          var nativeReplace = history.replaceState;
          var suppressPush = false;

          // Same selector the tracker uses. Origin + pathname and no query, which
          // is byte-identical to what <Seo> renders a moment later, so the tag is
          // never briefly wrong for a crawler -- and the tracker drops the query
          // from the recorded path regardless.
          function syncCanonical() {
            var link = document.querySelector('link[rel="canonical"][href]');
            if (link) link.href = location.origin + location.pathname;
          }

          history.pushState = function () {
            if (!suppressPush) nativePush.apply(this, arguments);
            syncCanonical();
          };

          history.replaceState = function () {
            var before = location.pathname;
            nativeReplace.apply(this, arguments);
            syncCanonical();
            if (location.pathname === before) return;

            // Hand the tracker a pageview without touching the history stack. By
            // now history.pushState is the tracker's wrapper, so calling it runs
            // its reporter, while suppressPush stops the real push underneath.
            suppressPush = true;
            try { history.pushState(history.state, ''); } finally { suppressPush = false; }
          };
        })();

        var csScript = document.createElement('script');
        csScript.id = 'counterscale-script';
        csScript.src = 'https://counterscale.peterreijm.workers.dev/tracker.js';
        csScript.setAttribute('data-site-id', 'milkmenot.com');
        csScript.defer = true;
        document.head.appendChild(csScript);
      })();
    </script>
  </head>
  <body>
    <!-- Native app splash screen - shows immediately before React loads -->
    <div id="native-splash" style="
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #00bf63 0%, #00a855 100%);
    ">
      <div style="
        width: 96px;
        height: 96px;
        background: white;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        margin-bottom: 32px;
      ">
        <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#00bf63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2h8"/>
          <path d="M9 2v2.789a4 4 0 0 1-.672 2.219l-.656.984A4 4 0 0 0 7 10.212V20a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-9.789a4 4 0 0 0-.672-2.219l-.656-.984A4 4 0 0 1 15 4.788V2"/>
          <path d="M7 15a6.472 6.472 0 0 1 5 0 6.47 6.47 0 0 0 5 0"/>
        </svg>
      </div>
      <h1 style="
        font-size: 1.875rem;
        font-weight: 700;
        color: white;
        margin: 0 0 8px 0;
        font-family: system-ui, -apple-system, sans-serif;
      ">Plant Milk Reviews</h1>
      <p style="
        font-size: 1.125rem;
        color: rgba(255, 255, 255, 0.8);
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
      ">Ditch the Moo. Find Your New!</p>
      <div style="
        position: absolute;
        bottom: 64px;
        display: flex;
        gap: 6px;
      ">
        <div class="splash-dot" style="width: 10px; height: 10px; background: white; border-radius: 50%; animation: pulse 0.8s ease-in-out infinite;"></div>
        <div class="splash-dot" style="width: 10px; height: 10px; background: white; border-radius: 50%; animation: pulse 0.8s ease-in-out infinite 0.2s;"></div>
        <div class="splash-dot" style="width: 10px; height: 10px; background: white; border-radius: 50%; animation: pulse 0.8s ease-in-out infinite 0.4s;"></div>
      </div>
      <style>
        @keyframes pulse {
          0%, 100% { opacity: 0.5; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.3); }
        }
      </style>
    </div>
    <script>
      // Show native splash immediately if running in Capacitor
      (function() {
        var isNative = typeof window !== 'undefined' &&
          window.Capacitor &&
          window.Capacitor.isNativePlatform &&
          window.Capacitor.isNativePlatform();
        if (isNative) {
          document.getElementById('native-splash').style.display = 'flex';
        }
      })();
    </script>
    <!-- Launch screen for the home-screen app. Android first draws its own
         splash from the manifest (logo on #2144ff); this carries the same look
         on, with a loading animation, until the first page has rendered —
         instead of a pale page with a lone spinner. Only shown when launched
         from the home screen; a browser tab never sees it. React removes it
         (src/components/install/LaunchScreenDone.tsx); the timeout below is the
         backstop if React never gets that far. -->
    <div id="launch-screen" aria-hidden="true" style="display: none">
      <img src="/icons/icon-512.png" alt="" width="144" height="144" />
      <div class="launch-dots"><span></span><span></span><span></span></div>
      <style>
        #launch-screen {
          position: fixed;
          inset: 0;
          z-index: 9998;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 40px;
          background: #2144ff;
          transition: opacity 0.3s ease;
        }
        /* The logo's own blue edges would melt into the background and leave
           the blob's cut-off edges floating; a white ring frames it as an icon. */
        #launch-screen img {
          width: 144px;
          height: 144px;
          border-radius: 50%;
          border: 6px solid #fff;
          box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.45);
        }
        #launch-screen .launch-dots { display: flex; gap: 8px; }
        #launch-screen .launch-dots span {
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #fff;
          opacity: 0.4;
          animation: mmn-launch-dot 1s ease-in-out infinite;
        }
        #launch-screen .launch-dots span:nth-child(2) { animation-delay: 0.15s; }
        #launch-screen .launch-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes mmn-launch-dot {
          0%, 100% { opacity: 0.4; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.35); }
        }
        @media (prefers-reduced-motion: reduce) {
          #launch-screen .launch-dots span { animation: none; opacity: 0.8; }
        }
      </style>
    </div>
    <script>
      (function () {
        var standalone =
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
          window.navigator.standalone === true;
        var isNative = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
        var el = document.getElementById('launch-screen');
        if (!standalone || isNative || !el) return;
        el.style.display = 'flex';
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 10000);
      })();
    </script>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
