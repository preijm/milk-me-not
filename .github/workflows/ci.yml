name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint

      # `tsc --noEmit` checks nothing here: the root tsconfig has "files": []
      # and only project references, which plain tsc does not follow. Build
      # mode walks them, so this covers src and vite.config.ts alike.
      - name: Run TypeScript type check
        run: bunx tsc --build

  lockfiles:
    name: Refresh lockfiles
    # Dependabot reads package-lock.json, which bun does not produce, so main
    # has to carry one. Regenerating it is the easy half; where to do it is the
    # part that went wrong.
    #
    # This used to be two steps inside Lint & Type Check, which pushed the
    # result straight back to the branch under test. On a pull request that did
    # three bad things at once. It rewrote the head *before* lint and tsc ran,
    # so the checks reported against a commit that was no longer the tip and
    # the real head went unverified — that is how #109 merged with no checks.
    # It needed `[skip ci]` to avoid triggering itself, which guaranteed the
    # new head had none. And on a Dependabot branch, a commit from
    # github-actions[bot] makes Dependabot treat the PR as edited by someone
    # else and abandon it: no more rebases, no recreation, forever. Twelve
    # dependency PRs were frozen that way.
    #
    # So it runs on main and nowhere near a pull request.
    #
    # It used to commit straight to main with `[skip ci]`. That stopped working
    # the moment the "checks must pass" ruleset was added, because the rule is
    # evaluated when the push arrives: a brand-new commit has no checks, so the
    # push is refused. `[skip ci]` guaranteed it never would have any. Dropping
    # the marker would not have helped either — nothing can run checks on a
    # commit that has not landed yet.
    #
    # So it opens a pull request instead, and the checks run there like anyone
    # else's. The branch name is fixed and force-pushed, so repeated runs update
    # one pull request rather than opening a pile of them.
    if: github.event_name == 'push'
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js for lockfile generation
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Generate package-lock.json for Dependabot
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Open a pull request if the lockfile moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # bun.lockb is not in this repo; naming it here would fail the diff.
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current; nothing to do."
            exit 0
          fi

          BRANCH=chore/lockfile-refresh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package-lock.json
          git commit -m "chore: refresh package-lock.json"
          git push --force origin "$BRANCH"

          # An open pull request picks the force-push up on its own, so only
          # open one when there is not already one waiting.
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore: refresh package-lock.json" \
              --body "Regenerated with Node 20 so Dependabot reads a current lockfile. Opened by CI; nothing here is hand-written."
          fi

          # Merges itself once the same checks everyone else waits for pass.
          gh pr merge "$BRANCH" --squash --auto --delete-branch

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bunx vitest run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build
