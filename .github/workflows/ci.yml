name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint

      # `tsc --noEmit` checks nothing here: the root tsconfig has "files": []
      # and only project references, which plain tsc does not follow. Build
      # mode walks them, so this covers src and vite.config.ts alike.
      - name: Run TypeScript type check
        run: bunx tsc --build

  lockfiles:
    name: Refresh lockfiles
    # Dependabot reads package-lock.json, which bun does not produce, so main
    # has to carry one. Regenerating it is the easy half; where to do it is the
    # part that went wrong.
    #
    # This used to be two steps inside Lint & Type Check, which pushed the
    # result straight back to the branch under test. On a pull request that did
    # three bad things at once. It rewrote the head *before* lint and tsc ran,
    # so the checks reported against a commit that was no longer the tip and
    # the real head went unverified — that is how #109 merged with no checks.
    # It needed `[skip ci]` to avoid triggering itself, which guaranteed the
    # new head had none. And on a Dependabot branch, a commit from
    # github-actions[bot] makes Dependabot treat the PR as edited by someone
    # else and abandon it: no more rebases, no recreation, forever. Twelve
    # dependency PRs were frozen that way.
    #
    # So it runs on main and nowhere near a pull request.
    #
    # It used to commit straight to main with `[skip ci]`. That stopped working
    # the moment the "checks must pass" ruleset was added, because the rule is
    # evaluated when the push arrives: a brand-new commit has no checks, so the
    # push is refused. `[skip ci]` guaranteed it never would have any. Dropping
    # the marker would not have helped either — nothing can run checks on a
    # commit that has not landed yet.
    #
    # So it opens a pull request instead. The branch name is fixed and
    # force-pushed, so repeated runs update one pull request rather than
    # opening a pile of them.
    #
    # The checks do *not* run there like anyone else's, which is the part that
    # was assumed and is not true. GitHub does not start a workflow for an
    # event created with GITHUB_TOKEN — that is a deliberate loop guard — so a
    # pull request opened here never triggers CI or CodeQL. #166 sat with
    # literally zero checks reported, and "checks must pass" requires four, so
    # the `--auto` merge below waited on results that could not arrive. Every
    # push to main that moved the lockfile refreshed a pull request that could
    # never merge.
    #
    # Nothing can be done about that from inside the job: the four required
    # contexts include CodeQL, and reporting a synthetic pass for a security
    # analysis that never ran is not a trade worth making. It needs an identity
    # that is not GITHUB_TOKEN, which is what LOCKFILE_APP_ID and
    # LOCKFILE_APP_PRIVATE_KEY are for — see "The lockfile pull request needs
    # its own identity" in CLAUDE.md.
    #
    # Without those secrets the job stops before opening anything and says why.
    # That is deliberately not a failure: main is fine, the lockfile is merely
    # a little stale, and failing every push to main over a missing optional
    # secret would be worse than the drift.
    if: github.event_name == 'push'
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js for lockfile generation
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Generate package-lock.json for Dependabot
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      # An app installation token, so the pull request is opened by something
      # other than GITHUB_TOKEN and the required checks actually start.
      # Both halves, or neither.
      #
      # A step `if:` cannot read `secrets`, so the app id is a repository
      # variable and the presence of the key has to be established in a shell
      # step that can see it. Gating on the variable alone looked equivalent
      # and is not: the variable is the easy half to add, so the likely
      # in-between state is an id with no key, which sends
      # create-github-app-token looking for a PEM that is not there and turns
      # this job red on every push to main. Not a blocking failure — Refresh
      # lockfiles is not one of the four required contexts — but a red main is
      # a signal people stop reading.
      #
      # Nothing is printed but "yes" or "no". Echoing either value, even to
      # prove it is empty, is how a key ends up in a public log.
      - name: Is the lockfile app configured?
        id: app_config
        env:
          PRIVATE_KEY: ${{ secrets.LOCKFILE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "${{ vars.LOCKFILE_APP_ID }}" ] && [ -n "${PRIVATE_KEY:-}" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Mint a token that can trigger workflows
        id: app_token
        if: steps.app_config.outputs.ready == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.LOCKFILE_APP_ID }}
          private-key: ${{ secrets.LOCKFILE_APP_PRIVATE_KEY }}

      - name: Open a pull request if the lockfile moved
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail

          # bun.lockb is not in this repo; naming it here would fail the diff.
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current; nothing to do."
            exit 0
          fi

          # Opening one with GITHUB_TOKEN would produce a pull request no
          # workflow ever looks at, waiting on four checks that cannot arrive.
          # Better to leave the lockfile stale and say so.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::The lockfile has moved, but no pull request was opened: the LOCKFILE_APP_ID variable and the LOCKFILE_APP_PRIVATE_KEY secret are not both set. A pull request from GITHUB_TOKEN cannot start the checks it needs to merge. See CLAUDE.md."
            exit 0
          fi

          BRANCH=chore/lockfile-refresh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package-lock.json
          git commit -m "chore: refresh package-lock.json"

          # The push has to come from the app as well, not just the pull
          # request. A later run force-pushes this branch, and a `synchronize`
          # attributed to GITHUB_TOKEN would leave the updated head with no
          # checks — the same dead end one step further along.
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$BRANCH"

          # An open pull request picks the force-push up on its own, so only
          # open one when there is not already one waiting.
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore: refresh package-lock.json" \
              --body "Regenerated with Node 20 so Dependabot reads a current lockfile. Opened by CI; nothing here is hand-written."
          fi

          # Merges itself once the same checks everyone else waits for pass.
          gh pr merge "$BRANCH" --squash --auto --delete-branch

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bunx vitest run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build
