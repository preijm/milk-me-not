# Deploys the built SPA to Cloudflare Workers on every push to main.
#
# Lovable has no deploy-on-push setting — publishing there is always a manual
# snapshot — so this replaces that click. Until the milkmenot.com nameservers
# move to Cloudflare this only touches the workers.dev URL, which means it is
# safe to run alongside Lovable while comparing the two.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys uploading assets at once can interleave. Queue them instead, and
# let an in-flight upload finish rather than cancelling it half-done.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Runs alongside the tests rather than before them: nothing here depends on
  # the other, and the deploy waits for both. Still not a copy of ci.yml's first
  # job, but no longer because that one writes to the branch — it does not any
  # more. Lockfile refresh is its own job there now, and it stays there: one
  # writer on main is the point, and a deploy has no business committing.
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint

      # Build mode, not --noEmit: the root tsconfig is "files": [] plus project
      # references, which plain tsc does not follow.
      - name: Run TypeScript type check
        run: bunx tsc --build

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bunx vitest run

  deploy:
    name: Deploy to Cloudflare
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Both keys have to be present in this step. Vite inlines `VITE_*` at
      # build time, so setting either on the Worker afterwards would be too
      # late — the bundle is already written.
      #
      # An absent VITE_SENTRY_DSN is not a failure and must not become one.
      # Error reporting is inert without it, the boundary still catches crashes
      # and shows a page, and the site is unaffected. A build that refused to
      # run without it would take the whole deploy down over a nicety.
      #
      # SENTRY_AUTH_TOKEN works the same way: with it the build makes hidden
      # source maps, uploads them to Sentry under this build's release and
      # deletes them; without it, no maps and nothing uploaded. It lives on
      # this step only — no other step needs to talk to Sentry.
      - name: Build project
        run: bun run build
        env:
          VITE_MAPBOX_PUBLIC_KEY: ${{ secrets.VITE_MAPBOX_PUBLIC_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # The Sentry plugin deletes the maps after uploading them, but a failed
      # upload only warns, and it is not documented whether the cleanup still
      # runs then. Source maps must never reach the edge, so make sure here.
      - name: Remove source maps from dist
        run: find dist -name '*.map' -print -delete

      # Uploads ./dist per wrangler.toml. No build happens here; the step above
      # already produced the artifact this deploys.
      #
      # cloudflare/wrangler-action installs wrangler with npm, which refuses to
      # resolve the @zxing/browser -> @zxing/library peer conflict already in
      # package.json and fails before wrangler ever runs. bunx resolves it the
      # same way every other step in this repo does. Wrangler reads both
      # credentials from the environment on its own.
      - name: Deploy to Cloudflare Workers
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Open the live site in a real browser once the new build is being served.
  #
  # The steps above prove the code passed and the upload succeeded. Neither
  # proves the deployed page runs: a bundle that loads and then throws is green
  # everywhere up to here. A failure turns this run red, and a red Deploy on
  # main is filed as an issue by alert-on-failure.yml.
  smoke:
    name: Smoke test the live site
    needs: [deploy]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      # The edge takes a moment to start serving the upload. Testing before it
      # does would test the previous build and report on the wrong thing, so
      # wait for version.json to name this commit. Same 12 characters the
      # health check compares.
      - name: Wait for this build to be live
        env:
          SITE: https://milkmenot.com
        run: |
          set -uo pipefail
          EXPECTED=$(git rev-parse HEAD | cut -c1-12)
          for i in $(seq 1 36); do
            LIVE=$(curl -sS --max-time 10 "$SITE/version.json?t=$(date +%s)" | sed -n 's/.*"buildId"[: ]*"\([^"]*\)".*/\1/p')
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Serving $LIVE."
              exit 0
            fi
            echo "Serving '${LIVE:-nothing}', waiting for $EXPECTED..."
            sleep 5
          done
          echo "::error::After three minutes the site still is not serving $EXPECTED."
          exit 1

      - name: Run the smoke test
        run: bunx playwright test -c playwright.live.config.ts

      - name: Keep the traces from a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
