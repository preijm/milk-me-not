# Deploys the built SPA to Cloudflare Workers on every push to main.
#
# Lovable has no deploy-on-push setting — publishing there is always a manual
# snapshot — so this replaces that click. Until the milkmenot.com nameservers
# move to Cloudflare this only touches the workers.dev URL, which means it is
# safe to run alongside Lovable while comparing the two.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys uploading assets at once can interleave. Queue them instead, and
# let an in-flight upload finish rather than cancelling it half-done.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Runs alongside the tests rather than before them: nothing here depends on
  # the other, and the deploy waits for both. Still not a copy of ci.yml's first
  # job, but no longer because that one writes to the branch — it does not any
  # more. Lockfile refresh is its own job there now, and it stays there: one
  # writer on main is the point, and a deploy has no business committing.
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint

      # Build mode, not --noEmit: the root tsconfig is "files": [] plus project
      # references, which plain tsc does not follow.
      - name: Run TypeScript type check
        run: bunx tsc --build

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bunx vitest run

  deploy:
    name: Deploy to Cloudflare
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Vite inlines VITE_* variables into the bundle at build time, so the
      # Mapbox key has to be present in this step. Setting it on the Worker
      # afterwards would be too late — the bundle is already written.
      - name: Build project
        run: bun run build
        env:
          VITE_MAPBOX_PUBLIC_KEY: ${{ secrets.VITE_MAPBOX_PUBLIC_KEY }}

      # Uploads ./dist per wrangler.toml. No build happens here; the step above
      # already produced the artifact this deploys.
      #
      # cloudflare/wrangler-action installs wrangler with npm, which refuses to
      # resolve the @zxing/browser -> @zxing/library peer conflict already in
      # package.json and fails before wrangler ever runs. bunx resolves it the
      # same way every other step in this repo does. Wrangler reads both
      # credentials from the environment on its own.
      - name: Deploy to Cloudflare Workers
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
