# Versioning and release notes, on request.
#
# Deliberately not on every push to main. It used to be, and for months that
# went unnoticed because the job was broken and cut nothing at all. Once it
# started working it produced 34 releases in three days — a version per merged
# pull request, each one an email to everyone watching, and a version number
# that meant nothing because "add a test file" got the same bump as a feature.
#
# A release is a thing someone decides to make. Run this from the Actions tab
# when there is something worth announcing, and the notes collect every commit
# since the last tag. Nothing is lost by waiting: main still deploys on every
# push, so releasing is about marking a point, not about shipping.

name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bunx vitest run

  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The highest version tag there is, not the newest one reachable from
      # HEAD.
      #
      # `git describe --tags` asks the second question, and asking it is why
      # this job produced nothing at all for months. `v0.1.0` points at a
      # `chore(release): v0.1.0` commit that never landed on main, so it is
      # reachable from nothing: describe found no tag, fell back to
      # package.json's 0.0.0, recomputed 0.1.0, found that tag already existed
      # and skipped the release — on every push, reporting success each time.
      #
      # Taking the higher of the tag and package.json means neither a stale tag
      # nor a stale manifest can drag the version backwards.
      - name: Get current version
        id: current_version
        run: |
          TAG_VERSION=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          VERSION=$(printf '%s\n%s\n' "${TAG_VERSION:-0.0.0}" "$PKG_VERSION" | sort -V | tail -n1)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Highest tag: ${TAG_VERSION:-none}. package.json: $PKG_VERSION. Using: $VERSION"

      # What counts as "since the last release".
      #
      # A tag outside this history cannot bound a range. That case reads the
      # recent log instead of the whole of it: main carries 3,174 commits, and
      # listing them all produced a 101KB release body against GitHub's 125KB
      # limit — a note nobody can read, one good week away from failing the
      # step outright. The cap is stated in the notes rather than applied
      # quietly.
      #
      # It applies once. As soon as a tag lands on main this is the ordinary
      # two-dot range, and the cap never comes up again.
      - name: Find the range to describe
        id: range
        run: |
          LAST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$LAST_TAG" ] && git merge-base --is-ancestor "$LAST_TAG" HEAD 2>/dev/null; then
            echo "range=$LAST_TAG..HEAD" >> $GITHUB_OUTPUT
            echo "limit=" >> $GITHUB_OUTPUT
            echo "Describing $LAST_TAG..HEAD"
          else
            echo "range=" >> $GITHUB_OUTPUT
            echo "limit=--max-count=50" >> $GITHUB_OUTPUT
            echo "No tag in this history - describing the last 50 commits"
          fi

      - name: Determine version bump
        id: version_bump
        run: |
          COMMITS=$(git log ${{ steps.range.outputs.limit }} --pretty=format:"%s" ${{ steps.range.outputs.range }})

          if echo "$COMMITS" | grep -qE "^(feat|feature)(\(.+\))?!:|^BREAKING CHANGE:"; then
            echo "bump=major" >> $GITHUB_OUTPUT
          elif echo "$COMMITS" | grep -qE "^(feat|feature)(\(.+\))?:"; then
            echo "bump=minor" >> $GITHUB_OUTPUT
          else
            echo "bump=patch" >> $GITHUB_OUTPUT
          fi

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          BUMP="${{ github.event.inputs.release_type || steps.version_bump.outputs.bump }}"

          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}

          case $BUMP in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Generate release notes
        id: notes
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)

          COMMITS=$(git log ${{ steps.range.outputs.limit }} --pretty=format:"- %s" --reverse ${{ steps.range.outputs.range }})

          FEATURES=$(echo "$COMMITS" | grep -E "^- (feat|feature)" | sed 's/^- feat\(.*\): /- /' | sed 's/^- feature\(.*\): /- /' || true)
          FIXES=$(echo "$COMMITS" | grep -E "^- fix" | sed 's/^- fix\(.*\): /- /' || true)
          DOCS=$(echo "$COMMITS" | grep -E "^- docs" | sed 's/^- docs\(.*\): /- /' || true)
          CHORES=$(echo "$COMMITS" | grep -E "^- (chore|build|ci)" | sed 's/^- chore\(.*\): /- /' | sed 's/^- build\(.*\): /- /' | sed 's/^- ci\(.*\): /- /' || true)
          OTHER=$(echo "$COMMITS" | grep -vE "^- (feat|feature|fix|docs|chore|build|ci)" || true)

          ENTRY="## [$NEW_VERSION] - $DATE"$'\n'

          if [ -n "$FEATURES" ]; then
            ENTRY="$ENTRY"$'\n'"### Added"$'\n'"$FEATURES"$'\n'
          fi

          if [ -n "$FIXES" ]; then
            ENTRY="$ENTRY"$'\n'"### Fixed"$'\n'"$FIXES"$'\n'
          fi

          if [ -n "$DOCS" ]; then
            ENTRY="$ENTRY"$'\n'"### Documentation"$'\n'"$DOCS"$'\n'
          fi

          if [ -n "$CHORES" ]; then
            ENTRY="$ENTRY"$'\n'"### Maintenance"$'\n'"$CHORES"$'\n'
          fi

          if [ -n "$OTHER" ]; then
            ENTRY="$ENTRY"$'\n'"### Other"$'\n'"$OTHER"$'\n'
          fi

          # Say what was left out, rather than letting a capped list read as a
          # complete one.
          if [ -n "${{ steps.range.outputs.limit }}" ]; then
            NOTE="_No release tag exists in this branch's history, so this lists the 50 most recent commits rather than everything since the last release._"
            ENTRY="$ENTRY"$'\n'"$NOTE"$'\n'
          fi

          echo "entry<<RELEASE_NOTES_EOF" >> $GITHUB_OUTPUT
          echo "$ENTRY" >> $GITHUB_OUTPUT
          echo "RELEASE_NOTES_EOF" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: tag_check
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            # Said out loud. A silent skip is what hid this job's failure for
            # months: every run was green and every run did nothing.
            echo "::warning::Tag v$NEW_VERSION already exists - no release created."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Tag the commit that is already on main. Nothing is committed, and
      # nothing is pushed to the branch.
      #
      # `main` is protected - checks must pass, no deletion or force-push -
      # with a bypass for repository admins that `github-actions[bot]` does not
      # have. The old job committed a CHANGELOG edit and ran
      # `git push origin main`, which that ruleset would refuse; it had simply
      # never got far enough to find out. Both rulesets target the branch, so
      # pushing a tag ref is unaffected.
      #
      # Committing back to main would also make this job trigger itself: the
      # push would start another release run, which would cut another version,
      # and so on. And these notes quote commit subjects verbatim, several of
      # which contain the CI skip marker - putting them in a commit message
      # would make that commit skip its own workflows. The notes go to the
      # GitHub Release instead, which is where anyone looks for them.
      # CHANGELOG.md stays hand-written, which is what it already was - this
      # workflow never once managed to touch it.
      - name: Tag the release
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.new_version.outputs.version }}
          name: Release v${{ steps.new_version.outputs.version }}
          body: ${{ steps.notes.outputs.entry }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
