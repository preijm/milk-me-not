<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="68" height="68" viewBox="-4 -4 68 68">
<!--
  The blue field runs to the edge on purpose. The file arrived with the field
  inset by 0.522 and a white ring painted in the gap - a keyline for placing
  the logo on a white page. Inside a full-bleed tile that ring is a halo: half
  a pixel wide, invisible on the cream card, and plainly visible along the top
  and left of a dark row, because contain centres a 60-unit artwork in a 56 or
  44px tile and the fractional edge rounds up on those two sides.

  So the ring is gone and the field covers the whole viewBox. Nothing else here
  is white - the roundel is #fff000 - so there is no second one to find.

  The viewBox is then padded 4 either side, and that is the same rule aldi.svg
  and kaufland.svg are framed by. The roundel is r=26.15 about (30,30), so in
  the 60-unit artwork it sat 6.4% from the edge - and a tile corner eats 0.293r,
  which is 8.8% at the radius the brand table uses. The blue survived only as
  four slivers and the circle read as bursting out of the tile rather than
  sitting on a field, which is what every other panel here does. At 68 the
  margin is 11.5% and the roundel clears the corner with its ring intact.
-->
    <path fill="#0050aa" d="M-4 -4h68v68h-68z"></path>
