<?xml version="1.0" encoding="UTF-8"?>
<!--
  Framed square on purpose, like friesche-vlag.svg. EDEKA's panel is 32x39, so
  in a square tile it was letterboxed: yellow slab with the tile's own ground
  showing down both sides. The viewBox is padded by 3.453 either side to make
  it square and the yellow ground is drawn across all of it, which costs the
  mark nothing - contain already fitted this panel by height, so the E is
  rendered at exactly the size it always was.

  The hairline blue keyline the export carried is gone with it. It ran along
  the panel edge, where the tile's rounded corners cut it, and at these sizes
  it was half a pixel of noise.
-->
<svg width="52.23" height="52.23" version="1.2" viewBox="-3.453 0 39.173 39.173" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
