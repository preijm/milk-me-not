<!--
  BIO+, the organic own-brand of Superunie — so it turns up on Coop, Spar,
  PLUS, Hoogvliet, Dirk and the rest, not one retailer. Taken from the brand's
  own site, bio-plus.nl, because it is on Wikimedia Commons under neither name.

  A mark, not a panel: flat #009F4D on transparency, so it takes the white
  ground like the other wordmarks. 170x63 is wide, and that is fine here —
  narrower than netto (2.82) and rewe (2.88), and with no tagline to lose it
  still reads at 44px, which a lockup would not.
-->
